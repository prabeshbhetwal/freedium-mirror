name: Verify extension

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Offline and installed Chromium checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Offline regression and syntax
        run: |
          node --check background.js
          node --check browser.test.cjs
          node --test background.test.cjs
      - name: Install pinned browser test tooling
        run: |
          npm install --no-save --ignore-scripts --no-package-lock playwright@1.64.0
          npx playwright install --with-deps chromium
      - name: Installed extension integration
        run: node --test browser.test.cjs
